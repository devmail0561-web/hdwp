# WAF Signatures — Phase 2 bypass intelligence
# Format:
#   waf_id:
#     headers: [noms de headers dont la présence seule identifie le WAF]
#     server_patterns: [substrings dans le header Server]
#     body_patterns: [substrings dans le corps de réponse 403/503]
#     block_status_codes: [codes HTTP utilisés par ce WAF pour bloquer]
#     effective_bypasses: [noms de stratégies ordonnés, most effective first]

cloudflare:
  headers:
    - cf-ray
    - cf-cache-status
    - cf-request-id
    - cf-connecting-ip
  server_patterns:
    - cloudflare
  body_patterns:
    - "Attention Required | Cloudflare"
    - "__cf_bm"
    - "Cloudflare Ray ID"
  block_status_codes: [403, 503]
  effective_bypasses:
    - hpp
    - chunked_abuse
    - whitespace_variation
    - content_type_confusion
    - rate_limit_evasion
    - websocket_upgrade

aws_waf:
  headers:
    - x-amzn-requestid
    - x-amzn-trace-id
    - x-amz-apigw-id
    - x-amzn-errortype
  server_patterns: []
  body_patterns:
    - "Request blocked by AWS WAF"
    - "ForbiddenByAWSWAF"
  block_status_codes: [403]
  effective_bypasses:
    - cl_te_smuggling
    - multipart_boundary
    - junk_char
    - hpp
    - content_type_confusion

akamai:
  headers:
    - x-check-cacheable
    - akamaighost
    - x-akamai-transformed
    - x-serial
  server_patterns:
    - akamaighost
    - akamai
  body_patterns:
    - "Reference #"
    - "AkamaiGHost"
  block_status_codes: [403]
  effective_bypasses:
    - te_cl_smuggling
    - http2_smuggling
    - whitespace_variation
    - cache_poisoning
    - tls_fingerprint

imperva:
  headers:
    - x-iinfo
    - x-cdn
  server_patterns:
    - incapsula
  body_patterns:
    - "_Incapsula_Resource"
    - "incap_ses"
    - "incident_id"
    - "visid_incap"
  block_status_codes: [403]
  effective_bypasses:
    - hpp
    - multipart_boundary
    - chunked_abuse
    - ipv6_bypass
    - junk_char

modsecurity:
  headers:
    - x-mod-security
  server_patterns:
    - mod_security
    - modsecurity
  body_patterns:
    - "ModSecurity"
    - "This error was generated by Mod_Security"
    - "406 Not Acceptable"
  block_status_codes: [403, 406]
  effective_bypasses:
    - whitespace_variation
    - junk_char
    - content_type_confusion
    - te_cl_smuggling
    - multipart_boundary

f5_bigip:
  headers:
    - bigipserver
    - x-wa-info
    - x-cnection
  server_patterns:
    - bigip
    - tmui
  body_patterns:
    - "The requested URL was rejected"
    - "Please consult with your administrator"
  block_status_codes: [403]
  effective_bypasses:
    - tls_fingerprint
    - websocket_upgrade
    - rate_limit_evasion
    - whitespace_variation
    - ipv6_bypass

# Fallback: WAF inconnu ou non identifié
generic:
  headers: []
  server_patterns: []
  body_patterns:
    - "access denied"
    - "blocked by"
    - "web application firewall"
  block_status_codes: [403, 406]
  effective_bypasses:
    - whitespace_variation
    - junk_char
    - hpp
    - rate_limit_evasion
