# HDWP Engine -- Context file example
# Copy this file and adapt it to your engagement.

target:
  base_url: "https://target.example.com"
  name: "Application cible"

scope:
  include:
    - "https://target.example.com/*"
    - "https://api.target.example.com/*"
  exclude:
    - "https://target.example.com/logout"
    - "*.cdn.*"

threat_model:
  focus:
    - authorization
    - confidentiality
    - state
    - integrity
  business_logic: true

roles:
  - name: "anonymous"
    credentials: null
  - name: "user_a"
    credentials:
      type: "bearer"
      token: "${USER_A_TOKEN}"
  - name: "user_b"
    credentials:
      type: "bearer"
      token: "${USER_B_TOKEN}"
  - name: "admin"
    credentials:
      type: "bearer"
      token: "${ADMIN_TOKEN}"

options:
  allow_write: false
  max_requests_per_minute: 60
  language: "fr"
  # Mode exploration continue — le moteur itère après la passe initiale
  # tant que de nouvelles hypothèses sont disponibles (pivots, confirmations).
  # continuous: true
  # scan_time_limit_minutes: 60    # durée max en minutes (0 = illimité)
  # Mode offline — fichier JSON de signatures CVE pré-exportées
  # (pour les missions en réseau isolé)
  # offline_cve_db: /path/to/cve_cache.json

plugins:
  enabled:
    - "core.authorization.bola"
    - "core.authorization.authz"
  disabled: []
  config: {}

# Réglages fins du moteur — toutes les valeurs sont optionnelles (défauts sûrs).
# tuning:
#   confirmed_threshold: 0.85      # score global confiance → finding CONFIRMED
#   severity_high_threshold: 0.90  # score → sévérité HIGH dans le rapport
#   severity_medium_threshold: 0.80
#   priority_high_threshold: 0.60  # score de priorité → hypothèse HIGH
#   priority_medium_threshold: 0.30
#   weight_oracle_strength: 0.25   # poids dimension oracle dans le score confiance
#   weight_reproducibility: 0.30
#   weight_observation_quality: 0.15
#   weight_behavioral_specificity: 0.15
#   weight_experiment_coverage: 0.15
#   bola_role_confirmation_boost: 0.15  # boost confiance BOLA si 2 rôles → 200
#   impact_weights:                 # surcharger les poids KB par type de propriété
#     authorization: 1.2            # renforcer l'authz sur cette cible
#     injection: 0.8

# Configuration LLM optionnelle (ADR-002 : non-décisionnel, jamais décisif seul)
# La clé API est lue depuis l'environnement — jamais en clair ici.
# llm:
#   enabled: false
#   provider: anthropic          # anthropic | openai | ollama
#   model: claude-sonnet-4-6     # gpt-4o-mini | llama3.2 | mistral | ...
#   base_url: null               # pour ollama: http://localhost:11434/v1
#
# Exemples par provider :
#   Anthropic : export ANTHROPIC_API_KEY=sk-ant-...
#   OpenAI    : export OPENAI_API_KEY=sk-...
#   Ollama    : aucune clé requise, base_url: http://localhost:11434/v1

